name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run test suite
        run: npm test

      - name: Inject server-side Cloudflare storage config & Build Astro application
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e '
          const fs = require("fs");
          const content = `export const CF_RUNTIME_CREDENTIALS = {\n  accountId: ${JSON.stringify(process.env.CLOUDFLARE_ACCOUNT_ID || "")},\n  apiToken: ${JSON.stringify(process.env.CLOUDFLARE_API_TOKEN || "")},\n};\n`;
          fs.writeFileSync("./src/lib/cf-credentials.ts", content);
          '
          npm run build
          git checkout -- ./src/lib/cf-credentials.ts

      - name: Ensure Cloudflare Pages project & Deploy without overwriting bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set in GitHub Repository Secrets."
            exit 1
          fi

          npx wrangler pages project create uzitone --production-branch=main || true
          npx wrangler pages project create uzitone-data --production-branch=main || true

          # Remove wrangler.toml before deploying so Wrangler never overwrites
          # Cloudflare Pages dashboard bindings or environment variables.
          rm -f wrangler.toml
          npx wrangler pages deploy ./dist --project-name=uzitone --branch=main --commit-dirty=true
