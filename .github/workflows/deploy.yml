name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run test suite
        run: npm test

      - name: Build Astro application for Cloudflare Pages
        run: npm run build

      - name: Provision or locate D1 database, sync GitHub cache to D1, pair with Pages & Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are required."
            exit 1
          fi

          # 1. Ensure Pages project 'uzitone' exists & clean up any temporary 'uzitone-data' project
          npx wrangler pages project create uzitone --production-branch=main || true
          npx wrangler pages project delete uzitone-data --yes 2>/dev/null || true

          # 2. Discover existing D1 database (bound to Pages or named 'uzitone-db') or auto-create 'uzitone-db'
          D1_ID=$(node -e '
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const headers = {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json",
          };

          async function main() {
            const pagesUrl = `https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects/uzitone`;
            let boundD1Id = null;

            const pagesRes = await fetch(pagesUrl, { headers });
            if (pagesRes.ok) {
              const pagesData = await pagesRes.json();
              boundD1Id =
                pagesData?.result?.deployment_configs?.production?.d1_databases?.DB?.id ||
                pagesData?.result?.deployment_configs?.preview?.d1_databases?.DB?.id ||
                null;
            }

            const d1ListUrl = `https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database`;
            const d1ListRes = await fetch(d1ListUrl, { headers });

            if (!d1ListRes.ok) {
              const errBody = await d1ListRes.text();
              if (boundD1Id) {
                console.error("Using already-bound D1 database ID from Pages config:", boundD1Id);
                process.stdout.write(boundD1Id);
                return;
              }
              console.error("::error::Failed to access Cloudflare D1 API. Please ensure CLOUDFLARE_API_TOKEN has [Account -> D1 -> Edit] permission. Response:", errBody);
              process.exit(1);
            }

            const d1ListData = await d1ListRes.json();
            const dbs = Array.isArray(d1ListData?.result) ? d1ListData.result : [];

            if (boundD1Id && dbs.some((d) => d.uuid === boundD1Id)) {
              console.error("Reusing existing paired D1 database:", boundD1Id);
              process.stdout.write(boundD1Id);
              return;
            }

            const existingDb = dbs.find((d) => d.name === "uzitone-db") || dbs.find((d) => d.name && d.name.startsWith("uzitone"));
            if (existingDb && existingDb.uuid) {
              console.error(`Found existing D1 database "${existingDb.name}" (${existingDb.uuid})`);
              process.stdout.write(existingDb.uuid);
              return;
            }

            console.error("No existing uzitone D1 found. Creating new D1 database \"uzitone-db\"...");
            const createRes = await fetch(d1ListUrl, {
              method: "POST",
              headers,
              body: JSON.stringify({ name: "uzitone-db" }),
            });

            if (!createRes.ok) {
              const errText = await createRes.text();
              console.error("::error::Failed to create D1 database uzitone-db:", errText);
              process.exit(1);
            }

            const createData = await createRes.json();
            const newId = createData?.result?.uuid;
            if (!newId) {
              console.error("::error::D1 database created but UUID missing in response.");
              process.exit(1);
            }
            console.error("Created new D1 database uzitone-db:", newId);
            process.stdout.write(newId);
          }

          main().catch((err) => {
            console.error("::error::Unexpected error during D1 provisioning:", err);
            process.exit(1);
          });
          ')

          if [ -z "$D1_ID" ]; then
            echo "::error::Could not determine D1 Database ID."
            exit 1
          fi

          echo "Resolved D1 Database ID: $D1_ID"

          # 3. Pair D1 database with Cloudflare Pages project (production & preview) via Pages API
          node -e '
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const d1Id = process.argv[1];
          const url = `https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects/uzitone`;

          (async () => {
            const patchRes = await fetch(url, {
              method: "PATCH",
              headers: {
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                deployment_configs: {
                  production: {
                    d1_databases: {
                      DB: { id: d1Id },
                    },
                  },
                  preview: {
                    d1_databases: {
                      DB: { id: d1Id },
                    },
                  },
                },
              }),
            });
            if (!patchRes.ok) {
              const text = await patchRes.text();
              console.error("::error::Failed to bind D1 database to Pages project:", text);
              process.exit(1);
            }
            console.log("Successfully paired D1 database (DB -> " + d1Id + ") with Cloudflare Pages project uzitone.");
          })();
          ' "$D1_ID"

          # 4. Write resolved D1 binding to wrangler.toml and apply idempotent schema migration
          cat <<EOF > wrangler.toml
          name = "uzitone"
          compatibility_date = "2025-02-14"
          compatibility_flags = ["nodejs_compat"]
          pages_build_output_dir = "./dist"

          [[d1_databases]]
          binding = "DB"
          database_name = "uzitone-db"
          database_id = "$D1_ID"
          EOF

          npx wrangler d1 execute uzitone-db --remote --file=./schema.sql

          # 5. Pre-warm D1 github_repos_cache & github_profile_cache using authenticated GITHUB_TOKEN
          node -e '
          const fs = require("fs");
          const ghToken = process.env.GITHUB_TOKEN;
          const headers = {
            "Accept": "application/vnd.github+json",
            "User-Agent": "uzit-one-ci-sync",
          };
          if (ghToken) headers["Authorization"] = `Bearer ${ghToken}`;

          function sqlStr(val) {
            if (val === null || val === undefined) return "NULL";
            return "'" + String(val).replace(/'/g, "''") + "'";
          }

          (async () => {
            const [profRes, reposRes] = await Promise.all([
              fetch("https://api.github.com/users/uz-it-one", { headers }),
              fetch("https://api.github.com/users/uz-it-one/repos?type=owner&per_page=100&sort=pushed", { headers }),
            ]);

            const now = Date.now();
            const lines = [];

            if (profRes.ok) {
              const profile = await profRes.json();
              const profileJson = JSON.stringify({ profile, cachedAt: now });
              lines.push(`INSERT OR REPLACE INTO app_meta (key, value) VALUES ('github_profile_cache', ${sqlStr(profileJson)});`);
            }

            if (reposRes.ok) {
              const rawRepos = await reposRes.json();
              const owned = rawRepos.filter((r) => r && !r.private && r.owner && r.owner.login.toLowerCase() === "uz-it-one" && r.owner.type === "User");
              if (owned.length > 0) {
                lines.push("DELETE FROM github_repos_cache;");
                for (const r of owned) {
                  lines.push(
                    `INSERT INTO github_repos_cache (name, full_name, html_url, description, fork, language, stargazers_count, forks_count, pushed_at, updated_at, owner_login, owner_type, cached_at) VALUES (${sqlStr(r.name)}, ${sqlStr(r.full_name)}, ${sqlStr(r.html_url)}, ${sqlStr(r.description)}, ${r.fork ? 1 : 0}, ${sqlStr(r.language)}, ${Number(r.stargazers_count) || 0}, ${Number(r.forks_count) || 0}, ${sqlStr(r.pushed_at)}, ${sqlStr(r.updated_at)}, ${sqlStr(r.owner.login)}, ${sqlStr(r.owner.type)}, ${now});`
                  );
                }
                lines.push(`INSERT OR REPLACE INTO app_meta (key, value) VALUES ('github_repos_synced_at', ${sqlStr(String(now))});`);
                console.log(`Prepared D1 cache sync for ${owned.length} owned public repositories.`);
              }
            }

            if (lines.length > 0) {
              fs.writeFileSync("./sync-github-cache.sql", lines.join("\n"));
            }
          })();
          '

          if [ -f "./sync-github-cache.sql" ]; then
            npx wrangler d1 execute uzitone-db --remote --file=./sync-github-cache.sql
            rm -f ./sync-github-cache.sql
          fi

          # 6. Remove wrangler.toml before deploying so Wrangler never overwrites dashboard env_vars (e.g. ADMIN_PASSWORD)
          rm -f wrangler.toml
          npx wrangler pages deploy ./dist --project-name=uzitone --branch=main --commit-dirty=true
